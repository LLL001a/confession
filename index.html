<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 · {{TA}}的小游戏</title>
    <style>
        /* ========== 设计系统 ========== */
        :root {
            --rose-50: #fff1f2;
            --rose-100: #ffe4e6;
            --rose-200: #fecdd3;
            --rose-300: #fda4af;
            --rose-400: #fb7185;
            --rose-500: #f43f5e;
            --rose-600: #e11d48;
            --ink: #432f36;
            --ink-soft: #8a6f78;
            --cream: #fffaf7;
            --glass: rgba(255, 255, 255, 0.72);
            --shadow-soft: 0 24px 60px -18px rgba(225, 29, 72, 0.22), 0 10px 30px -12px rgba(0, 0, 0, 0.10);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        body {
            font-family: 'Quicksand', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background:
                radial-gradient(1200px 800px at 85% -10%, rgba(244, 63, 94, 0.16), transparent 60%),
                radial-gradient(1000px 700px at -10% 110%, rgba(251, 191, 36, 0.12), transparent 55%),
                linear-gradient(160deg, #fff7f8 0%, #ffeef1 45%, #ffe3ea 100%);
        }

        /* 背景光晕呼吸 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(420px 420px at var(--gx, 50%) var(--gy, 20%), rgba(251, 113, 133, 0.16), transparent 70%);
            pointer-events: none;
            animation: glowDrift 9s ease-in-out infinite alternate;
        }
        @keyframes glowDrift {
            0% { transform: translate(-4%, -2%) scale(1); }
            100% { transform: translate(4%, 3%) scale(1.12); }
        }

        /* ========== 开场揭晓 ========== */
        .intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: linear-gradient(160deg, #fff7f8, #ffe3ea);
            transition: opacity 0.7s var(--ease), visibility 0.7s;
        }
        .intro-overlay.done { opacity: 0; visibility: hidden; pointer-events: none; }
        .intro-heart {
            font-size: 56px;
            animation: heartBeat 1.1s ease-in-out infinite;
            filter: drop-shadow(0 10px 24px rgba(225, 29, 72, 0.35));
        }
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.18); }
            28% { transform: scale(1); }
            42% { transform: scale(1.14); }
            70% { transform: scale(1); }
        }
        .intro-text {
            font-size: 15px;
            letter-spacing: 3px;
            color: var(--ink-soft);
            font-weight: 600;
            animation: textGlow 1.6s ease-in-out infinite alternate;
        }
        @keyframes textGlow {
            from { opacity: 0.55; }
            to { opacity: 1; }
        }
        .intro-line {
            width: 90px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--rose-300), var(--rose-500));
            animation: lineGrow 0.9s var(--ease) infinite alternate;
        }
        @keyframes lineGrow {
            from { transform: scaleX(0.4); opacity: 0.5; }
            to { transform: scaleX(1); opacity: 1; }
        }

        /* ========== 游戏容器 ========== */
        .game-container {
            position: relative;
            z-index: 10;
            width: 94%;
            max-width: 640px;
            max-height: 96vh;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--radius-lg, 40px);
            padding: clamp(14px, 2.6vh, 26px) clamp(16px, 3.6vw, 34px) clamp(18px, 3vh, 34px);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: cardIn 0.9s var(--ease) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(10px, 2vh, 20px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .title-area h1 {
            font-size: clamp(1.7rem, 7vw, 2.7rem);
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(120deg, #f43f5e, #e11d48 45%, #b91c1c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.15;
            cursor: pointer;
            transition: transform 0.25s var(--ease);
        }
        .title-area h1:active { transform: scale(0.94); }
        .title-area p {
            font-size: clamp(0.65rem, 2.6vw, 0.8rem);
            color: var(--rose-400);
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-top: 3px;
        }

        .scores-area { display: flex; gap: clamp(8px, 2vw, 14px); }

        .score-card {
            background: linear-gradient(140deg, var(--rose-500), var(--rose-600));
            border-radius: 18px;
            padding: clamp(5px, 1.4vh, 9px) clamp(14px, 3vw, 20px);
            text-align: center;
            box-shadow: 0 10px 22px -8px rgba(225, 29, 72, 0.55);
            color: #fff;
            transition: transform 0.25s var(--ease);
        }
        .score-card:hover { transform: translateY(-2px); }
        .score-label {
            font-size: clamp(0.6rem, 2.4vw, 0.75rem);
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
        }
        .score-value {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 800;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(8px, 1.8vh, 18px);
            flex-wrap: wrap;
            gap: 8px;
        }
        .game-intro {
            font-size: clamp(0.7rem, 2.7vw, 0.85rem);
            color: var(--rose-600);
            background: linear-gradient(120deg, rgba(244, 63, 94, 0.10), rgba(251, 113, 133, 0.16));
            border: 1px solid rgba(244, 63, 94, 0.14);
            padding: 6px clamp(10px, 2vw, 16px);
            border-radius: 40px;
            font-weight: 600;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
            border: none;
            padding: 8px clamp(18px, 4vw, 26px);
            border-radius: 40px;
            font-size: clamp(0.75rem, 2.8vw, 0.85rem);
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s var(--ease), box-shadow 0.25s var(--ease);
            font-family: inherit;
            box-shadow: 0 10px 22px -8px rgba(225, 29, 72, 0.6);
            letter-spacing: 1px;
        }
        .restart-btn:hover { transform: translateY(-2px) scale(1.02); }
        .restart-btn:active { transform: scale(0.94); }

        /* 游戏板 */
        .game-board {
            position: relative;
            margin: clamp(8px, 1.5vh, 18px) 0;
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        .grid-background {
            position: relative;
            background: rgba(244, 63, 94, 0.07);
            border: 1px solid rgba(244, 63, 94, 0.08);
            border-radius: clamp(14px, 3vw, 22px);
            padding: clamp(6px, 1.5vw, 12px);
            width: 100%;
            height: 100%;
        }
        .grid-row {
            display: flex;
            margin-bottom: clamp(4px, 1.2vw, 12px);
            gap: clamp(4px, 1.2vw, 12px);
        }
        .grid-row:last-child { margin-bottom: 0; }
        .grid-cell {
            flex: 1;
            aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.66);
            border-radius: clamp(9px, 2.5vw, 16px);
            box-shadow: inset 0 1px 3px rgba(225, 29, 72, 0.05);
        }
        .tiles-container {
            position: absolute;
            top: clamp(6px, 1.5vw, 12px);
            left: clamp(6px, 1.5vw, 12px);
            right: clamp(6px, 1.5vw, 12px);
            bottom: clamp(6px, 1.5vw, 12px);
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: clamp(9px, 2.5vw, 16px);
            font-family: inherit;
            box-shadow: 0 6px 16px -4px rgba(225, 29, 72, 0.35);
            transition: all 0.08s cubic-bezier(0.2, 0.8, 0.4, 1);
            will-change: left, top;
            backface-visibility: hidden;
        }
        @keyframes appear {
            0% { transform: scale(0.2); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .tile-appear { animation: appear 0.14s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .tile-merge { animation: merge 0.14s cubic-bezier(0.2, 0.9, 0.4, 1.1); }

        /* 弹窗 */
        .game-message {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 250, 247, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: clamp(16px, 4vw, 26px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s var(--ease), visibility 0.3s;
        }
        .game-message.show { opacity: 1; visibility: visible; }
        .game-message p {
            font-size: clamp(1.2rem, 5vw, 1.9rem);
            font-weight: 800;
            background: linear-gradient(120deg, var(--rose-500), var(--rose-600));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: clamp(14px, 3vh, 22px);
            text-align: center;
            padding: 0 12px;
        }
        .message-buttons {
            display: flex;
            gap: clamp(10px, 3vw, 18px);
            flex-wrap: wrap;
            justify-content: center;
        }
        .message-btn {
            background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
            border: none;
            padding: 9px clamp(18px, 4vw, 28px);
            border-radius: 40px;
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s var(--ease), box-shadow 0.25s var(--ease);
            font-family: inherit;
            box-shadow: 0 10px 22px -8px rgba(225, 29, 72, 0.6);
            letter-spacing: 1px;
        }
        .message-btn:hover { transform: translateY(-2px); }
        .message-btn:active { transform: scale(0.94); }

        /* 底部 */
        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: clamp(8px, 1.5vh, 18px);
            padding-top: clamp(8px, 1.5vh, 14px);
            border-top: 1px dashed rgba(244, 63, 94, 0.22);
            gap: 8px;
            flex-wrap: wrap;
        }
        .game-explanation {
            font-size: clamp(0.6rem, 2.5vw, 0.75rem);
            color: var(--ink-soft);
            line-height: 1.4;
        }
        .game-explanation strong { color: var(--rose-600); }
        .next-link {
            position: relative;
            background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
            padding: 8px clamp(18px, 4vw, 30px);
            border-radius: 40px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            display: inline-block;
            font-size: clamp(0.7rem, 2.8vw, 0.9rem);
            letter-spacing: 1px;
            overflow: hidden;
            transition: transform 0.15s var(--ease), box-shadow 0.3s var(--ease);
            box-shadow: 0 10px 22px -8px rgba(225, 29, 72, 0.6);
            animation: pulseSoft 2.2s ease-in-out infinite;
        }
        .next-link:hover { transform: translateY(-2px) scale(1.03); }
        .next-link:active { transform: scale(0.95); }
        @keyframes pulseSoft {
            0%, 100% { box-shadow: 0 10px 22px -8px rgba(225, 29, 72, 0.55); }
            50% { box-shadow: 0 12px 30px -6px rgba(225, 29, 72, 0.8); }
        }

        /* ========== 心形烟花彩蛋 ========== */
        .firework-p {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.9s ease-out;
            will-change: transform, opacity;
            filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
        }
        /* ========== 金色星星雨（2048 达成） ========== */
        .star {
            position: fixed;
            top: -6vh;
            pointer-events: none;
            z-index: 9998;
            animation: starFall ease-in forwards;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.85));
        }
        @keyframes starFall {
            0% { transform: translateY(-4vh) translateX(0) rotate(0deg) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateY(50vh) translateX(28px) rotate(180deg) scale(1); }
            100% { transform: translateY(108vh) translateX(-20px) rotate(360deg) scale(0.8); opacity: 0.5; }
        }
        /* ========== 光环脉冲 ========== */
        .ring-wave {
            position: fixed;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border: 3px solid rgba(244, 63, 94, 0.75);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9997;
            animation: ringExpand 1.15s ease-out forwards;
        }
        @keyframes ringExpand {
            0% { transform: scale(0.4); opacity: 1; }
            100% { transform: scale(16); opacity: 0; }
        }

        /* 彩蛋提示 toast */
        .egg-toast {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translate(-50%, -120%);
            z-index: 9999;
            background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 10px 22px;
            border-radius: 40px;
            box-shadow: 0 14px 34px -10px rgba(225, 29, 72, 0.7);
            transition: transform 0.5s var(--ease);
            white-space: nowrap;
        }
        .egg-toast.show { transform: translate(-50%, 0); }

        /* 移动端微调 */
        @media (max-width: 520px) {
            .game-intro { font-size: 0.7rem; }
        }
        @media (max-width: 380px) {
            .footer-links { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

<div class="intro-overlay" id="introOverlay">
    <div class="intro-heart">💗</div>
    <div class="intro-text">致 {{TA}}</div>
    <div class="intro-line"></div>
</div>

<div class="game-container">
    <div class="game-header">
        <div class="title-area">
            <h1 id="gameTitle">2048</h1>
            <p>💕 {{TA}}专属版 · 连点标题有惊喜 💕</p>
        </div>
        <div class="scores-area">
            <div class="score-card">
                <div class="score-label">得分</div>
                <div class="score-value" id="scoreValue">0</div>
            </div>
            <div class="score-card">
                <div class="score-label">最高分</div>
                <div class="score-value" id="bestValue">0</div>
            </div>
        </div>
    </div>

    <div class="game-info">
        <div class="game-intro">
            <strong>✨ 亲爱的{{TA}} ✨</strong> 先玩个小游戏吧
        </div>
        <button class="restart-btn" id="restartBtn">🔄 重新开始</button>
    </div>

    <div class="game-board">
        <div class="grid-background" id="gridBackground">
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
            <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        </div>
        <div class="tiles-container" id="tilesContainer"></div>
        <div class="game-message" id="gameMessage">
            <p id="messageText"></p>
            <div class="message-buttons">
                <button class="message-btn" id="keepPlayingBtn">继续游戏</button>
                <button class="message-btn" id="retryBtn">再来一次</button>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <div class="game-explanation">
            <strong>🎮 玩法：</strong>上下左右滑动，相同数字合并，目标是 2048！
        </div>
        <a href="pages/anniversary/index.html" class="next-link">💖 点我点我点我 💖</a>
    </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/site.js"></script>
<script>
    // ========== 开场揭晓动画 ==========
    (function () {
        const overlay = document.getElementById('introOverlay');
        setTimeout(() => {
            overlay.classList.add('done');
        }, 1600);
    })();

    // ========== 彩蛋特效 ==========
    // 心形烟花：先向心形轨迹汇聚，再向外爆散
    const FW_EMOJI = ['💗', '💖', '❤️', '✨', '🌸', '💕'];
    function heartFirework(x, y, count = 40) {
        const points = [];
        for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            points.push({ x: hx * 4.2, y: hy * 4.2 });
        }
        const els = points.map((p, i) => {
            const el = document.createElement('div');
            el.className = 'firework-p';
            el.textContent = FW_EMOJI[i % FW_EMOJI.length];
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.fontSize = (12 + Math.random() * 12) + 'px';
            document.body.appendChild(el);
            return { el, tx: p.x, ty: p.y };
        });
        // 相位 1：从爆点向心形轨迹汇聚
        requestAnimationFrame(() => {
            els.forEach(({ el, tx, ty }) => {
                el.style.transform = `translate(${tx}px, ${ty}px) scale(1.15)`;
                el.style.opacity = '1';
            });
        });
        // 相位 2：心形炸开，粒子向外飞散
        setTimeout(() => {
            els.forEach(({ el, tx, ty }) => {
                const a = Math.random() * Math.PI * 2;
                const d = 130 + Math.random() * 170;
                el.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.85s ease-in';
                el.style.transform = `translate(${tx + Math.cos(a) * d}px, ${ty + Math.sin(a) * d - 40}px) scale(0.15) rotate(${Math.random() * 360}deg)`;
                el.style.opacity = '0';
            });
        }, 1000);
        setTimeout(() => els.forEach(({ el }) => el.remove()), 2000);
    }

    // 光环脉冲
    function ringPulse(cx, cy, rounds = 2) {
        for (let r = 0; r < rounds; r++) {
            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    const ring = document.createElement('div');
                    ring.className = 'ring-wave';
                    ring.style.left = cx + 'px';
                    ring.style.top = cy + 'px';
                    ring.style.animationDelay = (i * 0.26) + 's';
                    document.body.appendChild(ring);
                    setTimeout(() => ring.remove(), 1500);
                }
            }, r * 300);
        }
    }

    // 金色星星雨
    function starRain(count = 44) {
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'star';
                el.textContent = ['⭐', '✨', '🌟', '💛'][Math.floor(Math.random() * 4)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (16 + Math.random() * 22) + 'px';
                el.style.animationDelay = (Math.random() * 0.8) + 's';
                el.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 4300);
            }, i * 50);
        }
    }

    // 彩蛋提示
    let toastTimer = null;
    function showEggToast(text) {
        let toast = document.getElementById('eggToast');
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'egg-toast';
            toast.id = 'eggToast';
            document.body.appendChild(toast);
        }
        toast.textContent = text;
        requestAnimationFrame(() => toast.classList.add('show'));
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // 彩蛋：连点标题 5 次 → 爱心雨
    (function () {
        const title = document.getElementById('gameTitle');
        let clicks = 0, lastTime = 0;
        title.addEventListener('click', () => {
            const now = Date.now();
            if (now - lastTime > 900) clicks = 0;
            lastTime = now;
            clicks++;
            if (clicks === 5) {
                clicks = 0;
                const r = title.getBoundingClientRect();
                heartFirework(r.left + r.width / 2, r.top + r.height / 2, 40);
                ringPulse(r.left + r.width / 2, r.top + r.height / 2);
                showEggToast('💥 彩蛋解锁：爱意烟花！');
            }
        });
    })();

    // ========== 2048 游戏（保留原逻辑） ==========
    class Game2048 {
        constructor(size = 4) {
            this.size = size;
            this.grid = [];
            this.score = 0;
            this.bestScore = localStorage.getItem('2048BestScore') ? parseInt(localStorage.getItem('2048BestScore')) : 0;
            this.won = false;
            this.over = false;
            this.animating = false;
            this.cellGap = 0;
            this.cellSize = 0;
            this.touchStart = null;

            this.handleKey = this.handleKey.bind(this);
            this.handleTouchStart = this.handleTouchStart.bind(this);
            this.handleTouchEnd = this.handleTouchEnd.bind(this);
            this.handleResize = this.handleResize.bind(this);

            this.init();
            this.bindEvents();
        }

        init() {
            this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
            this.score = 0;
            this.won = false;
            this.over = false;
            this.updateScoreUI();
            this.updateDimensions();
            this.addRandomTile();
            this.addRandomTile();
            this.renderAll();
        }

        updateDimensions() {
            const gridBg = document.querySelector('.grid-background');
            if (gridBg) {
                const firstRow = document.querySelector('.grid-row');
                if (firstRow) {
                    const cells = firstRow.querySelectorAll('.grid-cell');
                    if (cells.length > 0) {
                        const cellRect = cells[0].getBoundingClientRect();
                        this.cellSize = cellRect.width;
                        const rowStyle = getComputedStyle(firstRow);
                        this.cellGap = parseFloat(rowStyle.gap) || 12;
                    } else {
                        this.cellSize = 70;
                        this.cellGap = 12;
                    }
                } else {
                    this.cellSize = 70;
                    this.cellGap = 12;
                }
            } else {
                this.cellSize = 70;
                this.cellGap = 12;
            }
        }

        getTilePosition(row, col) {
            return {
                top: row * (this.cellSize + this.cellGap),
                left: col * (this.cellSize + this.cellGap)
            };
        }

        addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] === 0) emptyCells.push({ row: i, col: j });
                }
            }
            if (emptyCells.length > 0) {
                const randomIndex = Math.floor(Math.random() * emptyCells.length);
                const { row, col } = emptyCells[randomIndex];
                this.grid[row][col] = Math.random() < 0.9 ? 2 : 4;
                return { row, col, value: this.grid[row][col] };
            }
            return null;
        }

        move(direction) {
            if (this.over || this.animating) return false;
            this.animating = true;

            const oldGrid = this.copyGrid();
            const newGrid = this.copyGrid();
            let moveRecords = [];
            let moved = false;

            switch (direction) {
                case 'left': moved = this.moveLeft(newGrid, moveRecords); break;
                case 'right': moved = this.moveRight(newGrid, moveRecords); break;
                case 'up': moved = this.moveUp(newGrid, moveRecords); break;
                case 'down': moved = this.moveDown(newGrid, moveRecords); break;
            }

            if (moved) {
                let scoreGain = 0;
                for (let record of moveRecords) {
                    if (record.merged) scoreGain += record.newValue;
                }
                this.score += scoreGain;

                this.animateMove(moveRecords, () => {
                    this.grid = newGrid;
                    const newTile = this.addRandomTile();
                    this.renderAll();

                    if (newTile) {
                        const tileElement = document.querySelector(`.tile[data-row='${newTile.row}'][data-col='${newTile.col}']`);
                        if (tileElement) {
                            tileElement.classList.add('tile-appear');
                            setTimeout(() => tileElement.classList.remove('tile-appear'), 150);
                        }
                    }

                    this.updateScoreUI();
                    setTimeout(() => {
                        this.checkGameStatus();
                        this.animating = false;
                    }, 80);
                });
            } else {
                this.animating = false;
            }
            return moved;
        }

        animateMove(moveRecords, callback) {
            if (moveRecords.length === 0) {
                callback();
                return;
            }
            const uniqueMoves = new Map();
            for (let move of moveRecords) {
                const key = `${move.fromRow},${move.fromCol}`;
                if (!uniqueMoves.has(key)) uniqueMoves.set(key, move);
            }
            for (let move of uniqueMoves.values()) {
                const tile = document.querySelector(`.tile[data-row='${move.fromRow}'][data-col='${move.fromCol}']`);
                if (tile) {
                    const newPos = this.getTilePosition(move.toRow, move.toCol);
                    tile.style.left = newPos.left + 'px';
                    tile.style.top = newPos.top + 'px';
                    tile.dataset.row = move.toRow;
                    tile.dataset.col = move.toCol;
                    if (move.merged) {
                        setTimeout(() => {
                            tile.classList.add('tile-merge');
                            setTimeout(() => tile.classList.remove('tile-merge'), 150);
                        }, 30);
                    }
                }
            }
            setTimeout(callback, 100);
        }

        moveLeft(grid, moveRecords) {
            let moved = false;
            for (let i = 0; i < this.size; i++) {
                let row = [];
                for (let j = 0; j < this.size; j++) {
                    if (grid[i][j] !== 0) row.push({ value: grid[i][j], col: j });
                }
                let newRow = [];
                let skip = false;
                for (let k = 0; k < row.length; k++) {
                    if (skip) { skip = false; continue; }
                    if (k + 1 < row.length && row[k].value === row[k + 1].value) {
                        const newVal = row[k].value * 2;
                        newRow.push(newVal);
                        moveRecords.push({ fromRow: i, fromCol: row[k].col, toRow: i, toCol: newRow.length - 1, value: row[k].value, newValue: newVal, merged: true });
                        moveRecords.push({ fromRow: i, fromCol: row[k + 1].col, toRow: i, toCol: newRow.length - 1, value: row[k + 1].value, newValue: newVal, merged: true, isSecond: true });
                        skip = true;
                    } else {
                        newRow.push(row[k].value);
                        if (row[k].col !== newRow.length - 1) {
                            moveRecords.push({ fromRow: i, fromCol: row[k].col, toRow: i, toCol: newRow.length - 1, value: row[k].value, merged: false });
                        }
                    }
                }
                while (newRow.length < this.size) newRow.push(0);
                const oldRow = grid[i].slice();
                if (JSON.stringify(oldRow) !== JSON.stringify(newRow)) moved = true;
                grid[i] = newRow;
            }
            return moved;
        }

        moveRight(grid, moveRecords) {
            let moved = false;
            for (let i = 0; i < this.size; i++) {
                let row = [];
                for (let j = 0; j < this.size; j++) {
                    if (grid[i][j] !== 0) row.push({ value: grid[i][j], col: j });
                }
                let newRow = Array(this.size).fill(0);
                let colIdx = this.size - 1;
                let skip = false;
                for (let k = row.length - 1; k >= 0; k--) {
                    if (skip) { skip = false; continue; }
                    if (k - 1 >= 0 && row[k].value === row[k - 1].value) {
                        const newVal = row[k].value * 2;
                        newRow[colIdx] = newVal;
                        moveRecords.push({ fromRow: i, fromCol: row[k].col, toRow: i, toCol: colIdx, value: row[k].value, newValue: newVal, merged: true });
                        moveRecords.push({ fromRow: i, fromCol: row[k - 1].col, toRow: i, toCol: colIdx, value: row[k - 1].value, newValue: newVal, merged: true, isSecond: true });
                        skip = true;
                        colIdx--;
                    } else {
                        newRow[colIdx] = row[k].value;
                        if (row[k].col !== colIdx) {
                            moveRecords.push({ fromRow: i, fromCol: row[k].col, toRow: i, toCol: colIdx, value: row[k].value, merged: false });
                        }
                        colIdx--;
                    }
                }
                const oldRow = grid[i].slice();
                if (JSON.stringify(oldRow) !== JSON.stringify(newRow)) moved = true;
                grid[i] = newRow;
            }
            return moved;
        }

        moveUp(grid, moveRecords) {
            let moved = false;
            for (let j = 0; j < this.size; j++) {
                let col = [];
                for (let i = 0; i < this.size; i++) {
                    if (grid[i][j] !== 0) col.push({ value: grid[i][j], row: i });
                }
                let newCol = Array(this.size).fill(0);
                let rowIdx = 0;
                let skip = false;
                for (let k = 0; k < col.length; k++) {
                    if (skip) { skip = false; continue; }
                    if (k + 1 < col.length && col[k].value === col[k + 1].value) {
                        const newVal = col[k].value * 2;
                        newCol[rowIdx] = newVal;
                        moveRecords.push({ fromRow: col[k].row, fromCol: j, toRow: rowIdx, toCol: j, value: col[k].value, newValue: newVal, merged: true });
                        moveRecords.push({ fromRow: col[k + 1].row, fromCol: j, toRow: rowIdx, toCol: j, value: col[k + 1].value, newValue: newVal, merged: true, isSecond: true });
                        skip = true;
                        rowIdx++;
                    } else {
                        newCol[rowIdx] = col[k].value;
                        if (col[k].row !== rowIdx) {
                            moveRecords.push({ fromRow: col[k].row, fromCol: j, toRow: rowIdx, toCol: j, value: col[k].value, merged: false });
                        }
                        rowIdx++;
                    }
                }
                const oldCol = [];
                for (let i = 0; i < this.size; i++) oldCol.push(grid[i][j]);
                if (JSON.stringify(oldCol) !== JSON.stringify(newCol)) moved = true;
                for (let i = 0; i < this.size; i++) grid[i][j] = newCol[i];
            }
            return moved;
        }

        moveDown(grid, moveRecords) {
            let moved = false;
            for (let j = 0; j < this.size; j++) {
                let col = [];
                for (let i = this.size - 1; i >= 0; i--) {
                    if (grid[i][j] !== 0) col.push({ value: grid[i][j], row: i });
                }
                let newCol = Array(this.size).fill(0);
                let rowIdx = this.size - 1;
                let skip = false;
                for (let k = 0; k < col.length; k++) {
                    if (skip) { skip = false; continue; }
                    if (k + 1 < col.length && col[k].value === col[k + 1].value) {
                        const newVal = col[k].value * 2;
                        newCol[rowIdx] = newVal;
                        moveRecords.push({ fromRow: col[k].row, fromCol: j, toRow: rowIdx, toCol: j, value: col[k].value, newValue: newVal, merged: true });
                        moveRecords.push({ fromRow: col[k + 1].row, fromCol: j, toRow: rowIdx, toCol: j, value: col[k + 1].value, newValue: newVal, merged: true, isSecond: true });
                        skip = true;
                        rowIdx--;
                    } else {
                        newCol[rowIdx] = col[k].value;
                        if (col[k].row !== rowIdx) {
                            moveRecords.push({ fromRow: col[k].row, fromCol: j, toRow: rowIdx, toCol: j, value: col[k].value, merged: false });
                        }
                        rowIdx--;
                    }
                }
                const oldCol = [];
                for (let i = 0; i < this.size; i++) oldCol.push(grid[i][j]);
                if (JSON.stringify(oldCol) !== JSON.stringify(newCol)) moved = true;
                for (let i = 0; i < this.size; i++) grid[i][j] = newCol[i];
            }
            return moved;
        }

        copyGrid() {
            return this.grid.map(row => [...row]);
        }

        renderAll() {
            const tilesContainer = document.getElementById('tilesContainer');
            if (!tilesContainer) return;
            tilesContainer.innerHTML = '';
            this.updateDimensions();
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    const value = this.grid[i][j];
                    if (value !== 0) {
                        const pos = this.getTilePosition(i, j);
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.textContent = value;
                        tile.dataset.row = i;
                        tile.dataset.col = j;
                        const colors = this.getTileColor(value);
                        tile.style.backgroundColor = colors.bg;
                        tile.style.color = colors.text;
                        tile.style.top = pos.top + 'px';
                        tile.style.left = pos.left + 'px';
                        tile.style.width = this.cellSize + 'px';
                        tile.style.height = this.cellSize + 'px';
                        tile.style.fontSize = Math.max(14, this.cellSize * 0.4) + 'px';
                        tile.style.fontWeight = 'bold';
                        tilesContainer.appendChild(tile);
                    }
                }
            }
        }

        getTileColor(value) {
            const colors = {
                2: { bg: '#ffe9ef', text: '#c2415e' },
                4: { bg: '#ffd8e2', text: '#c2415e' },
                8: { bg: '#ffb9ca', text: '#fff' },
                16: { bg: '#ff97b0', text: '#fff' },
                32: { bg: '#fb7185', text: '#fff' },
                64: { bg: '#f43f5e', text: '#fff' },
                128: { bg: '#e11d48', text: '#fff' },
                256: { bg: '#be123c', text: '#fff' },
                512: { bg: '#9f1239', text: '#fff' },
                1024: { bg: '#881337', text: '#fff' },
                2048: { bg: '#f43f5e', text: '#fff' }
            };
            return colors[value] || { bg: '#f43f5e', text: '#fff' };
        }

        checkGameStatus() {
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] === 2048 && !this.won) {
                        this.won = true;
                        this.showMessage('🎉 恭喜' + CONF.ta + '！🎉');
                        starRain(46);
                        ringPulse(window.innerWidth / 2, window.innerHeight / 2, 3);
                        showEggToast('💗 达成 2048，星辰为你闪耀！');
                        return;
                    }
                }
            }
            let canMove = false;
            for (let i = 0; i < this.size; i++) {
                for (let j = 0; j < this.size; j++) {
                    if (this.grid[i][j] === 0) { canMove = true; break; }
                    if (j + 1 < this.size && this.grid[i][j] === this.grid[i][j + 1]) canMove = true;
                    if (i + 1 < this.size && this.grid[i][j] === this.grid[i + 1][j]) canMove = true;
                }
            }
            if (!canMove && !this.over) {
                this.over = true;
                this.showMessage('💔 游戏结束 💔');
            }
        }

        showMessage(text) {
            const messageDiv = document.getElementById('gameMessage');
            const messageText = document.getElementById('messageText');
            messageText.textContent = text;
            messageDiv.classList.add('show');
        }

        updateScoreUI() {
            const scoreElement = document.getElementById('scoreValue');
            const bestElement = document.getElementById('bestValue');
            if (scoreElement) scoreElement.textContent = this.score;
            if (this.score > this.bestScore) {
                this.bestScore = this.score;
                localStorage.setItem('2048BestScore', this.bestScore);
            }
            if (bestElement) bestElement.textContent = this.bestScore;
        }

        restart() {
            this.init();
            const messageDiv = document.getElementById('gameMessage');
            if (messageDiv) messageDiv.classList.remove('show');
            this.over = false;
            this.won = false;
            this.animating = false;
        }

        keepPlaying() {
            const messageDiv = document.getElementById('gameMessage');
            if (messageDiv) messageDiv.classList.remove('show');
            this.won = true;
        }

        handleKey(e) {
            const key = e.key;
            let direction = null;
            if (key === 'ArrowLeft') direction = 'left';
            else if (key === 'ArrowRight') direction = 'right';
            else if (key === 'ArrowUp') direction = 'up';
            else if (key === 'ArrowDown') direction = 'down';
            if (direction) {
                e.preventDefault();
                this.move(direction);
            }
        }

        handleTouchStart(e) {
            this.touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }

        handleTouchEnd(e) {
            if (!this.touchStart) return;
            const touchEnd = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
            const dx = touchEnd.x - this.touchStart.x;
            const dy = touchEnd.y - this.touchStart.y;
            if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                this.move(dx > 0 ? 'right' : 'left');
            } else {
                this.move(dy > 0 ? 'down' : 'up');
            }
            this.touchStart = null;
        }

        handleResize() {
            this.updateDimensions();
            this.renderAll();
        }

        bindEvents() {
            document.addEventListener('keydown', this.handleKey);
            document.addEventListener('touchstart', this.handleTouchStart, { passive: false });
            document.addEventListener('touchend', this.handleTouchEnd);
            window.addEventListener('resize', this.handleResize);
            const restartBtn = document.getElementById('restartBtn');
            const keepBtn = document.getElementById('keepPlayingBtn');
            const retryBtn = document.getElementById('retryBtn');
            if (restartBtn) restartBtn.addEventListener('click', () => this.restart());
            if (keepBtn) keepBtn.addEventListener('click', () => this.keepPlaying());
            if (retryBtn) retryBtn.addEventListener('click', () => this.restart());
        }
    }

    const game = new Game2048();

    // 光标光晕跟随（桌面端）
    document.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--gx', x + '%');
        document.documentElement.style.setProperty('--gy', y + '%');
    });

    console.log('%c💡 彩蛋提示：连点游戏标题 5 次，会有惊喜哦~', 'color:#fb7185; font-size:12px;');
